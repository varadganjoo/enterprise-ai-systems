[project]
name = "cited-knowledge-agent"
version = "0.1.0"
description = "Handbook Q&A that answers only with verbatim citations, plus a retrieval eval."
requires-python = ">=3.11"
dependencies = [
  "google-genai==2.34.0",
  "pydantic==2.14.2",
  "python-dotenv==1.2.4",
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "rank-bm25==0.2.2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
