[project]
name = "analytics-copilot"
version = "0.1.0"
description = "Text questions answered by executed read-only SQL."
requires-python = ">=3.11"
dependencies = [
  "sqlglot==30.27.0",
  "google-genai==2.34.0",
  "pydantic==2.14.3",
  "python-dotenv==1.2.4",
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
