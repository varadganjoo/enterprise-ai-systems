[project]
name = "model-router"
version = "0.1.0"
description = "Route tasks between a cheap Gemini model and a strong one."
requires-python = ">=3.11"
dependencies = [
  "google-genai==3.0.0",
  "pydantic==2.14.2",
  "python-dotenv==1.2.4",
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
