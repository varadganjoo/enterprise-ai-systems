[project]
name = "claim-auditor"
version = "0.1.0"
description = "Audit a draft. A claim is supported only when its quote is in a current source."
requires-python = ">=3.11"
dependencies = ["google-genai==2.34.0", "pydantic==2.14.2", "python-dotenv==1.2.4", "fastapi==0.162.0", "uvicorn[standard]==0.54.0"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
