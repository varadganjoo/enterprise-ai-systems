[project]
name = "claim-auditor"
version = "0.1.0"
description = "Audit a draft. A claim is supported only when its quote is in a current source."
requires-python = ">=3.11"
dependencies = ["google-genai==2.24.0", "pydantic==2.13.5", "python-dotenv==1.2.3", "fastapi==0.141.1", "uvicorn[standard]==0.53.0"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
