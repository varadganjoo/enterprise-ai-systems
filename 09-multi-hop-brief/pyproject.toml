[project]
name = "multi-hop-brief"
version = "0.1.0"
description = "A brief that withholds the number when a required source hop is unsupported."
requires-python = ">=3.11"
dependencies = ["google-genai==2.34.0", "pydantic==2.14.2", "python-dotenv==1.2.4", "fastapi==0.162.0", "uvicorn[standard]==0.54.0"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
